<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#690907" />
  <title>Where Is My Bus — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(232, 210, 181, 0.25), transparent 60%), #292522;
      color: #F5F0E8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 420px;
      background: rgba(245, 240, 232, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(232, 210, 181, 0.2);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; color: #E8D2B5; }
    p { color: #A5A79B; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.75rem; }
    button {
      background: #690907;
      color: #F5F0E8;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(105, 9, 7, 0.4);
      transition: all 0.2s ease;
    }
    button:hover { background: #82110f; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚍</div>
    <h1>You're Offline</h1>
    <p>Connect to the internet to track your bus in real-time. Where Is My Bus needs a network connection for live updates.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
